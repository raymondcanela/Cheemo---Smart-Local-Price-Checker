services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cheemo-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    depends_on:
      - db
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cheemo-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

  db:
    image: postgres:16
    container_name: cheemo-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: cheemo_db
      POSTGRES_USER: cheemo_user
      POSTGRES_PASSWORD: cheemo_password
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: